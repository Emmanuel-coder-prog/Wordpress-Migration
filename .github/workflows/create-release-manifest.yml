name: Create Release Manifest

on:
  workflow_run:
    workflows:
      - Release Images
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  manifest:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p downloaded-release-records

          expected_artifacts=(
            "release-cetech-corporate-php-${HEAD_SHA}"
            "release-cetech-corporate-nginx-${HEAD_SHA}"
            "release-cetech-store-gh-php-${HEAD_SHA}"
            "release-cetech-store-gh-nginx-${HEAD_SHA}"
            "release-cetech-blog-en-php-${HEAD_SHA}"
            "release-cetech-blog-en-nginx-${HEAD_SHA}"
            "release-cetech-front-door-nginx-${HEAD_SHA}"
          )

          for artifact in "${expected_artifacts[@]}"; do
            echo "Downloading artifact: ${artifact}"
            gh run download "${RUN_ID}" \
              --dir downloaded-release-records \
              -n "${artifact}"
          done

      - name: Assemble manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -d '' -t manifest_files < <(
            find downloaded-release-records \
              -type f \
              -name '*.json' \
              -print0 \
              | sort -z
          )

          if (( ${#manifest_files[@]} > 0 )); then
            jq -s . "${manifest_files[@]}" > release-manifest.json
          else
            printf '[]\n' > release-manifest.json
          fi

          jq -e 'length == 7' release-manifest.json

      - name: Upload manifest
        uses: actions/upload-artifact@v5
        with:
          name: cetech-release-manifest-${{ github.event.workflow_run.head_sha }}
          path: release-manifest.json
          retention-days: 365
